<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="미미팩토리 친해지기관 둘의 피크닉">
  <!-- 친해지기관 「둘의 피크닉」 — 초록 잔디색 바탕에 겹친 흰 원 둘(둘이 가까워진다). -->
  <rect width="64" height="64" rx="15" fill="#1eaa5c"/>
  <circle cx="24" cy="32" r="15" fill="#ffffff"/>
  <circle cx="40" cy="32" r="15" fill="#ffffff" fill-opacity="0.62"/>
</svg>
